<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Radar: pre-token protocols ranked by what their launch is worth</title>
<meta name="description" content="A radar for token launches: every protocol that records no token yet, ranked by the launch multiple the market already pays for its sector.">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#board">Skip to the board</a>
<header class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <div>
      <h1>Token Radar</h1>
      <p class="sub" id="tagline">pre-token protocols ranked by what a launch would be worth</p>
    </div>
  </div>
  <dl class="scoreline" id="scoreline"></dl>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main id="board" tabindex="-1" aria-busy="true">
    <div class="controls" id="controls"></div>
    <div class="tablewrap">
      <table class="board" id="table">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="foot" id="foot"></p>
  </main>
</div>
<div class="drawer" id="drawer" hidden role="dialog" aria-modal="false" aria-labelledby="drawer-title">
  <div class="drawer-inner" id="drawer-body"></div>
</div>
<script src="../data.js"></script>
<script src="app.js"></script>
</body>
</html>
